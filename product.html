.body ul{margin:0 0 13px 20px}
.body li{font-size:14.5px;line-height:1.75;color:#dfe7e1;margin-bottom:4px}

.urdu .udh{font-size:17px;color:var(--gold-l);margin-bottom:12px;text-align:center}
.urdu p{font-size:15px;line-height:2.05}
